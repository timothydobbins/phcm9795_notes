project:
  type: book
  output-dir: docs/_2027

# Global execution options for all chapters
execute:
  warning: false
  message: false

book:
  title: "PHCM9795: Foundations of Biostatistics"
  author: "Timothy Dobbins"
  date: "14-Jul-2026"
  date-format: "DD MMMM, YYYY"
  version: 1.0
  output-file: "PHCM9795 Course notes"
  chapters:
    - index.qmd
    - 01-intro.qmd
    # - 02-probability.qmd
    # - 03-precision.qmd
    # - 04-hypothesis-testing.qmd
    # - 05-comparing-two-means.qmd
    # - 06-proportions.qmd
    # - 07-testing-proportions.qmd
    # - 08-correlation-and-regression.qmd
    # - 09-non-parametrics.qmd
    # - 10-sample-size.qmd
    - 98.1-appendix1.qmd
    - references.qmd


bibliography: PHCM9795.bib

pdf-engine: xelatex

format:
  html:
    theme: cosmo
    highlight-style: monochrome
    title-block-banner: "#ffdc00"
    number-depth: 2
  pdf:
    papersize: A4
    documentclass: memoir
    mainfont: Roboto
    sansfont: Clancy
    highlight-style: monochrome
    toc: false
    title-block: false
    include-in-header: preamble.tex
    template-partials:
      - before-body.tex
  
# Note the use of template-partials: which builds the PDF with a
# title page specified in "before-body.tex"